name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - run: bundle exec rubocop

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby: ["3.1", "3.2", "3.3", "3.4"]
        gemfile: [Gemfile, gemfiles/rails_7.0.gemfile]
        exclude:
          - ruby: "3.4"
            gemfile: gemfiles/rails_7.0.gemfile
        include:
          - ruby: "3.1"
            gemfile: gemfiles/rails_7.1.gemfile
          - ruby: "3.3"
            gemfile: gemfiles/rails_7.1.gemfile
          - ruby: "3.2"
            gemfile: gemfiles/rails_8.0.gemfile
          - ruby: "3.3"
            gemfile: gemfiles/rails_8.0.gemfile
          - ruby: "3.4"
            gemfile: gemfiles/rails_8.0.gemfile
          - ruby: "3.2"
            gemfile: gemfiles/rails_7.2_view_component_4.gemfile
          - ruby: "3.3"
            gemfile: gemfiles/rails_7.2_view_component_4.gemfile
          - ruby: "3.4"
            gemfile: gemfiles/rails_7.2_view_component_4.gemfile
          - ruby: "3.2"
            gemfile: gemfiles/rails_8.1_view_component_4.gemfile
          - ruby: "3.3"
            gemfile: gemfiles/rails_8.1_view_component_4.gemfile
          - ruby: "3.4"
            gemfile: gemfiles/rails_8.1_view_component_4.gemfile
          - ruby: "4.0"
            gemfile: gemfiles/rails_8.1_view_component_4.gemfile
    env:
      BUNDLE_GEMFILE: ${{ matrix.gemfile }}
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - run: bundle exec rake spec:core
      - run: bundle exec rake spec
      - run: gem build view_component_atomix.gemspec
